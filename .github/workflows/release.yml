name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Compilation multi-plateforme
        run: |
          mkdir -p dist
          build() {
            GOOS=$1 GOARCH=$2 CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o "dist/$3" .
          }
          build windows amd64 open-chirpstack-windows-amd64.exe
          build darwin  arm64 open-chirpstack-macos-arm64
          build darwin  amd64 open-chirpstack-macos-amd64
          build linux   amd64 open-chirpstack-linux-amd64
          build linux   arm64 open-chirpstack-linux-arm64
          cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
